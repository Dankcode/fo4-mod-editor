[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "for4-mod-editor"
version = "0.1.0"
description = "Safe Python orchestration for Fallout 4 xEdit, Nexus Mods, and Vortex"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Leon" }]
dependencies = [
  "psutil>=5.9",
  "requests>=2.31",
]

[project.optional-dependencies]
notifications = ["win11toast>=0.35; sys_platform == 'win32'"]
packaging = ["pyinstaller>=6.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
fo4ap = "fo4_autopatch.cli:main"
for4-mod-editor = "fo4_autopatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
